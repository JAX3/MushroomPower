org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

## Environment
# Minecraft 26.1.2 / NeoForge 26.1.2 (values from the official NeoForge 26.1.2 ModDevGradle MDK).
# Minecraft 26.1+ is no longer obfuscated, so Parchment mappings are not needed.
minecraft_version=26.3
minecraft_version_range=[26.3]
neo_version=26.3.0.101
neo_version_range=[26.3,)
loader_version_range=[4,)

## Dev client
# Player name used by `gradlew runClient` (offline name only, no login, default skin). Empty = "Dev".
dev_username= Clown95x

## Optional dependencies
# JEI 29.x is the 26.1.2 line. 29.37.0.100 is the API baseline JEI's own build pins for 26.1.2;
# any newer 29.x build for 26.1.2 also works.
jei_version=31.17.0.109
jei_version_range=[31.0,)
# Jade (optional): https://modrinth.com/mod/jade - Modrinth maven version "<mod>+neoforge"
jade_version=26.3.5+neoforge
jade_version_range=[26.3,)
# Set to false to launch the dev client/server WITHOUT JEI (to verify the mod runs without it).
use_jei_runtime=true
# Mekanism has no release for Minecraft 26.1.2, so it is not part of this branch.

## Mod properties
mod_id=mycelialpower
mod_name=Mycelial Power
mod_license=MIT
mod_version=2.0.0
mod_group_id=com.mycelialpower
mod_authors=Mycelial Power contributors
mod_description=Adds the Mycelial Generator: a mushroom- and water-fuelled Forge Energy generator whose output scales exponentially across connected networks and which slowly spreads mycelium around it.
