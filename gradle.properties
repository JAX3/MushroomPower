org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

## Environment
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.172
neo_version_range=[21.1.0,)
loader_version_range=[4,)
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

## Optional dependencies
jei_version=19.21.0.247
jei_version_range=[19.0,)
# Set to false to launch the dev client/server WITHOUT JEI (to verify the mod runs without it).
use_jei_runtime=true
# Mekanism (https://modmaven.dev/mekanism/Mekanism/). Format: <minecraft version>-<mekanism version>.
mekanism_version=1.21.1-10.7.14.79
# Set to false to launch the dev runs without Mekanism.
use_mekanism_runtime=true
# Energy Meter from Modrinth Maven (maven.modrinth:energymeter:<version>).
# Modrinth Maven needs the exact Modrinth version number or version ID, NOT the jar file name.
# Version numbers look like "1.21.1-0.3.2+neoforge"; IDs are the 8-character code at the end of a version page URL.
# wpdceWCn = EnergyMeter-NeoForge-1.21.1-0.4.0 (https://modrinth.com/mod/energymeter/version/wpdceWCn)
energymeter_version=wpdceWCn
# Set to false to launch the dev runs without Energy Meter.
use_energymeter_runtime=true

## Mod properties
mod_id=mycelialpower
mod_name=Mycelial Power
mod_license=MIT
mod_version=1.0.0
mod_group_id=com.mycelialpower
mod_authors=Mycelial Power contributors
mod_description=Adds the Mycelial Generator: a mushroom- and water-fuelled Forge Energy generator whose output scales exponentially across connected networks and which slowly spreads mycelium around it.
