plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
    maven {
        // JEI
        name = 'BlameJared'
        url = 'https://maven.blamejared.com/'
        content {
            includeGroup 'mezz.jei'
            includeGroup 'net.mezzdev.config' // JEI 31+ runtime dependency
        }
    }
    maven {
        // JEI mirror
        name = 'ModMaven'
        url = 'https://modmaven.dev/'
        content { includeGroup 'mezz.jei' }
    }
}

base {
    archivesName = mod_id
}

// Minecraft 26.1.2 ships Java 25, so mods target Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version


    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // Player name in the dev client (set dev_username in gradle.properties). Offline only: this sets the
            // name, not a login, so it does not use your account's password, skin or Microsoft sign-in.
            if (project.hasProperty('dev_username') && !project.dev_username.toString().isBlank()) {
                programArguments.addAll '--username', project.dev_username.toString()
            }
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // Runs every @GameTest in this mod on a headless server and exits with a non-zero code on failure.
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// 'localRuntime': present in the dev runs but not published as a dependency (as in the NeoForge MDK).
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // JEI: compile against the API only, so the mod has no hard dependency on JEI.
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    if (project.use_jei_runtime.toBoolean()) {
        // Full JEI in the development runs only. Not bundled into the mod jar or published as a dependency.
        localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    }

    // Gradle 9 needs the JUnit platform launcher declared explicitly; the BOM keeps all JUnit versions aligned.
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

// Expands the properties above into neoforge.mods.toml.
var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            jei_version_range      : jei_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xlint:deprecation'
}

jar {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors
        ])
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
